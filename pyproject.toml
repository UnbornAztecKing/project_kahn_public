[project]
name = "project-kahn-public"
version = "0.1.0"
description = "Strategic interaction simulation between frontier AI models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.25",
    "httpx>=0.27",
    "orjson>=3.10",
    "json-repair>=0.30",
    "textual>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "click>=8.1",
    "watchfiles>=1.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.0",
]

[project.scripts]
slopr = "slopr.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
